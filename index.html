<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111111'/%3E%3Cpath d='M9 10h14l-4 12h-6L9 10Z' fill='%23f4f1ea'/%3E%3C/svg%3E" />
    <title>Vibe Director Studio</title>
    <style>
      .startup-fallback {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 8px;
        color: #2b241f;
        background: #f4eee3;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .startup-fallback strong {
        font-size: 18px;
      }
      .startup-fallback span {
        color: #7b6e62;
      }
      .startup-fallback small {
        max-width: 320px;
        color: #8c8177;
      }
      .startup-fallback button {
        justify-self: center;
        border: 1px solid #d6c9ba;
        border-radius: 999px;
        padding: 8px 14px;
        color: #2b241f;
        background: #fffaf3;
        font: inherit;
        cursor: pointer;
      }
      .startup-fallback button:focus-visible {
        outline: 2px solid #9a6a2f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-fallback" role="status" aria-live="polite">
        <strong>Vibe Director Studio</strong>
        <span data-startup-status>正在启动...</span>
      </div>
    </div>
    <script src="/startup-watchdog.js"></script>
    <script type="module" src="/src/main-agent-kernel.tsx"></script>
  </body>
</html>
